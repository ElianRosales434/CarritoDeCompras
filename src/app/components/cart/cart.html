<div class="cart-container">
  <div *ngIf="products.length === 0" class="empty">No hay productos en el carrito.</div>

  <ul *ngIf="products.length > 0" class="list">
    <li *ngFor="let p of products; let i = index" class="item">
      <span class="index">{{ i + 1 }}</span>
      <span class="name">{{ p }}</span>
    </li>
  </ul>
</div>
